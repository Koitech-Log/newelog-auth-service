services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME:-newelog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newelog}
    ports:
      - "5433:5432" # 5433 no host para não colidir com o motoristas-db (5432)
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-newelog} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:-newelog}
      DB_PASSWORD: ${DB_PASSWORD:-newelog}
      PORT: 8082
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (mín. 32 caracteres) no .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8082:8082"
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  auth-db-data:
