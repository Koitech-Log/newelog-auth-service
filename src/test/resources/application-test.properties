# Perfil dos testes automatizados: H2 em memória (modo PostgreSQL), sem depender de banco no CI.
spring.datasource.url=jdbc:h2:mem:auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=segredo-de-teste-com-mais-de-32-caracteres-ok
app.jwt.expiration-minutes=5
