spring.application.name=auth-service

server.port=${PORT:8082}

# Frontend / CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT (HS256). JWT_SECRET é obrigatório e precisa ter pelo menos 32 caracteres.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Gestor inicial: criado no primeiro start, só se a tabela de usuários estiver vazia.
app.bootstrap.admin-nome=${ADMIN_NOME:Administrador}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Database - PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Aceita "gestor"/"GESTOR" no JSON de entrada
spring.jackson.mapper.accept-case-insensitive-enums=true

# Sem UserDetailsService: a autenticação é feita pelo AuthService + JWT
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

logging.level.root=INFO
logging.level.br.com.newelog=INFO
